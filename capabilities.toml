[modules.url]
builtins = ["url"]
deps = ["process", "querystring"]
ambient = true

[modules.sea]
builtins = ["sea"]
deps = ["buffer"]

[modules.test]
builtins = ["test"]
deps = ["async_hooks"]

[modules.sqlite]
builtins = ["sqlite"]
deps = []
optional = true

[modules.ffi]
builtins = ["ffi"]
deps = []
per_isolate = true
