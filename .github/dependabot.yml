# Dependabot opens PRs against main and they run the normal CI gate.
#
# Version updates are deliberately scoped out of:
#   - tests/apps/*/package.json: pinned size fixtures, measured as they are.
#   - the thinpack-js forks pinned in Cargo.toml: updated only with their patches.
#
# Security updates come from the dependency graph rather than this file, so the
# fixtures still receive them; merge those by hand instead of pinning a
# vulnerable version.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Roll patch bumps into one PR to keep the queue small. Minor and major
    # bumps stay separate: 0.x crates may break within a minor version.
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
      include: "scope"
