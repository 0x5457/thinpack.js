name: Release

# `cargo xtask dist` builds the CLI and its runtime template, stages them side by side,
# packs and runs `examples/hello.js` from the staged directory, then writes a reproducible
# archive and its checksum. A target that cannot run its own artifacts fails the release
# instead of shipping them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dist:
    name: dist ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One broken target must not hide the others: a missing runner label or an
      # unavailable toolchain still leaves the other four assets diagnosable.
      fail-fast: false
      # Two kinds of Linux artifact. The static musl build has no libc floor and runs on any
      # distribution, Alpine included; the glibc build inherits the runner's floor (Ubuntu 24.04
      # is glibc 2.39) and exists for a host that wants dynamic linking.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The asset name carries the crate version while the installer reads the tag: a tag that
      # disagrees with `Cargo.toml` publishes archives nobody can download.
      - name: Assert the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(cargo pkgid -p thinpack-cli | sed 's/.*[#@]//')
          test "v${version}" = "${GITHUB_REF_NAME}"

      # musl-gcc compiles with -nostdinc, so the kernel uapi headers have to be added back or
      # libffi's tramp.c cannot find linux/limits.h; linux/types.h then pulls asm/types.h from
      # the multiarch directory, which `gcc -dumpmachine` names for the runner's own architecture.
      - name: Install musl
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools linux-libc-dev
          echo "CFLAGS=-idirafter /usr/include -idirafter /usr/include/$(gcc -dumpmachine)" >> "$GITHUB_ENV"

      # `cc` and `cmake` both build C here (QuickJS/WAMR, sqlite, libffi): point them at musl-gcc
      # so the objects match the static musl libc the target links against. `musl-gcc` compiles
      # with -nostdinc, so the kernel uapi headers under /usr/include have to be added back or
      # libffi's tramp.c cannot find linux/limits.h.
      - name: Build, verify, and archive (static)
        if: matrix.musl
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: musl-g++
          CXX_aarch64_unknown_linux_musl: musl-g++
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CMAKE_C_COMPILER: musl-gcc
        run: cargo xtask dist --target ${{ matrix.target }} --out dist

      - name: Build, verify, and archive
        if: ${{ !matrix.musl }}
        shell: bash
        run: cargo xtask dist --target ${{ matrix.target }} --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: thinpack-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: dist
    # Dispatching the workflow on a branch builds and verifies the whole matrix without
    # publishing anything, which is how the release itself is rehearsed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Re-running a failed publish has to replace the assets, not refuse the tag.
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
              --title "${GITHUB_REF_NAME}" --notes-file .github/release-notes.md ${DRAFT}
          fi
