name: Release

# `cargo xtask dist` builds the CLI and its runtime template, stages them side by side,
# packs and runs `examples/hello.js` from the staged directory, then writes a reproducible
# archive and its checksum. A target that cannot run its own artifacts fails the release
# instead of shipping them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dist:
    name: dist ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One broken target must not hide the others: a missing runner label or an
      # unavailable toolchain still leaves the other six assets diagnosable.
      fail-fast: false
      # Two kinds of Linux artifact. The static musl build has no libc floor and runs on any
      # distribution, Alpine included; the glibc build needs what its metadata records, which
      # `dist` measures on this runner rather than taking the image's version on trust.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The asset name carries the crate version while the installer reads the tag: a tag that
      # disagrees with `Cargo.toml` publishes archives nobody can download.
      - name: Assert the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(cargo pkgid -p thinpack-cli | sed 's/.*[#@]//')
          test "v${version}" = "${GITHUB_REF_NAME}"

      # musl-tools supplies a C wrapper, but the CommonJS lexer needs C++20.
      - name: Install the musl C and C++ toolchain
        if: matrix.musl
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              arch=x86_64
              checksum=eb1db6f0f3c2bdbdbfb993d7ef7e2eeef82ac1259f6a6e1757c33a97dbcef3ad
              ;;
            aarch64-unknown-linux-musl)
              arch=aarch64
              checksum=daf336cafa2c3c7daf42f6a46edc960f10a181fcf15ab9f1c43b192e8ad2a069
              ;;
            *) exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          toolchain="$arch-linux-musl-native"
          curl --fail --location --retry 3 --output "$toolchain.tgz" \
            "https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/$toolchain.tgz"
          printf '%s  %s\n' "$checksum" "$toolchain.tgz" | sha256sum -c -
          tar -xzf "$toolchain.tgz"
          bin="$RUNNER_TEMP/$toolchain/bin"
          linker_var="CARGO_TARGET_${TARGET^^}_LINKER"
          printf 'CC=%s/gcc\nCXX=%s/g++\nAR=%s/ar\n%s=%s/gcc\n' \
            "$bin" "$bin" "$bin" "${linker_var//-/_}" "$bin" >> "$GITHUB_ENV"

      - name: Build, verify, and archive (static)
        if: matrix.musl
        shell: bash
        env:
          # The Rust link line leaves out libgcc; arm64 C objects use its helpers.
          RUSTFLAGS: -C link-arg=-lgcc
        run: |
          cargo xtask dist --target ${{ matrix.target }} --out dist
          # The installer hands these archives to hosts with no musl loader at all, where a
          # dynamic pair would install and then fail to start. Both binaries run on the runner
          # either way, so only ELF itself can tell them apart: a static-pie has no PT_INTERP.
          for archive in dist/*.tar.gz; do
            tar -xzf "${archive}" -C dist
            for binary in "${archive%.tar.gz}"/thinpack*; do
              test -x "${binary}" || { echo "::error::no staged binary matched ${binary}"; exit 1; }
              if readelf --program-headers "${binary}" | grep -q INTERP; then
                echo "::error::${binary} is dynamically linked; the static artifacts must not be"
                exit 1
              fi
              file "${binary}"
            done
          done

      - name: Build, verify, and archive
        if: ${{ !matrix.musl }}
        shell: bash
        run: cargo xtask dist --target ${{ matrix.target }} --out dist

      - name: Build, verify, and archive V8
        if: ${{ !matrix.musl }}
        shell: bash
        run: cargo xtask dist --backend v8 --target ${{ matrix.target }} --out dist

      - name: Build, verify, and archive JSC
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: cargo xtask dist --backend jsc --target ${{ matrix.target }} --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: thinpack-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.release.toml
          if-no-files-found: error

  release:
    name: Publish
    needs: dist
    # Dispatching the workflow on a branch builds and verifies the whole matrix without
    # publishing anything, which is how the release itself is rehearsed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Each job wrote one `[[asset]]` table per archive, so concatenating the fragments is the
      # whole merge. The inspection below is the only place that parses the result: the manifest
      # is what the installer trusts, and a table that names an archive nobody published, or an
      # archive the manifest forgot, would install the wrong file on someone's machine.
      - name: Release metadata
        working-directory: dist
        run: |
          cat ./*.release.toml > thinpack-release.toml
          rm ./*.release.toml
          python3 - <<'PY'
          import pathlib, tomllib

          assets = tomllib.loads(pathlib.Path("thinpack-release.toml").read_text())["asset"]
          listed = set()
          for asset in assets:
              archive = asset["archive"]
              assert pathlib.Path(archive).is_file(), f"{archive} is listed but not published"
              assert pathlib.Path(archive + ".sha256").is_file(), f"{archive} has no checksum"
              assert asset["backend"] in {"quickjs", "v8", "jsc"}, asset
              assert asset["target"].endswith("-gnu") == ("min_glibc" in asset), asset
              listed.add(archive)
          shipped = {path.name for path in pathlib.Path(".").glob("*.tar.gz")}
          assert listed == shipped, f"listed {sorted(listed)}, published {sorted(shipped)}"
          print(f"{len(listed)} archives, one metadata table each")
          PY

      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Re-running a failed publish has to replace the assets, not refuse the tag.
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS dist/thinpack-release.toml --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS dist/thinpack-release.toml \
              --title "${GITHUB_REF_NAME}" --notes-file .github/release-notes.md ${DRAFT}
          fi
