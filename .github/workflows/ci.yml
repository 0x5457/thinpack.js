name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `macos` label starts the macOS job without a push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

  # The runtime binary is 265 MB and 201 MB of that is debug information; writing
  # it is the largest remaining piece of every job. Panic messages carry their own
  # file:line, so CI only loses the line numbers inside backtraces.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"


# The caches belong to `main`: a pull request restores the latest entry and never
# saves one. Its entry would duplicate `main`'s — the workspace crates are not
# cached, and the key only moves with `Cargo.lock` — while the repository shares a
# single 10 GB budget. Four open pull requests were holding 6.5 GB of the 13 GB
# in entries, and those duplicates pushed out what every run restores from.

jobs:
  generated:
    name: Format and generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The pinned toolchain and components come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      - run: cargo fmt --all --check
      - run: cargo xtask gen --check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      # The runner image already provides the C toolchain and cmake that the
      # QuickJS vendor build (WAMR) needs; V8 is linked from rusty_v8's prebuilt
      # release archive, which the build script downloads on demand.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      # rustfmt + clippy over QuickJS and V8, exactly as the local commit gate.
      - run: cargo xtask lint

  test:
    name: Test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      # The lint gate is platform-independent and runs once; this job covers the
      # platform-specific build (WAMR/QuickJS on macOS) and unit tests.
      # The npm-based acceptance fixtures under tests/ are not part of CI:
      # they download target packages and are run manually.
      #
      # Twice as many test threads as the runner has cores: the node compatibility
      # suite spends most of its time supervising child processes, and the heavy
      # encoding tests would otherwise pin the tail of the run.
      - run: cargo test --workspace -- --test-threads 8

  test-macos:
    name: Test (macos-latest)
    # A hosted macOS runner is regularly unavailable for 15 minutes, at which
    # point GitHub cancels the queued job, so a pull request can wait a quarter of
    # an hour for a job that never starts. macOS runs on main, on dispatch, and on
    # a PR labelled `macos`; the Linux job covers the rest of the suite.
    #
    # JSC lives in this job rather than a second macOS job: two queued jobs on the
    # same runner pool made one of them wait out the 15-minute cancellation window.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test --workspace -- --test-threads 8

      # `cargo xtask lint` covers this locally on macOS; the job lints the two
      # crates that carry backend-specific code so the whole gate need not run twice.
      - run: cargo clippy -p thinpack-core --all-targets --no-default-features --features backend-jsc
      - run: cargo clippy -p thinpack-rt --all-targets --no-default-features --features backend-jsc,node-all

      - run: cargo test -p thinpack-core --no-default-features --features backend-jsc

      # Two cases are skipped for engine limits: SharedArrayBuffer is absent from the
      # system framework and V8 natives syntax is V8-only. docs/gaps.md records them.
      - run: cargo test -p thinpack-rt --no-default-features --features backend-jsc,node-all -- --test-threads 8

      - run: cargo xtask dist --backend jsc

  windows-tools:
    name: Host tools (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      # The runtime itself is covered by the windows-smoke and windows-tests
      # jobs below; this job keeps a fast, engine-free check of the host
      # tooling: analysis, resolution, the payload format and the CLI.
      - run: cargo test -p thinpack-analyze -p thinpack-resolve -p thinpack-pack
      - run: cargo build -p thinpack-cli --release

  windows-smoke:
    name: Runtime smokes (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      # Template used by the smokes: ambient modules plus fs/os/dns/
      # child_process/net/cluster. The full default runtime is built in
      # `windows-tests` instead; see the note there for why that is a job of its
      # own.
      - run: >-
          cargo build -p thinpack-rt -p thinpack-cli --no-default-features
          --features thinpack-rt/backend-quickjs,thinpack-rt/node-process,thinpack-rt/node-console,thinpack-rt/node-timers,thinpack-rt/node-buffer,thinpack-rt/node-url,thinpack-rt/node-querystring,thinpack-rt/node-util,thinpack-rt/node-fs,thinpack-rt/node-dns,thinpack-rt/node-child-process,thinpack-rt/node-os,thinpack-rt/node-net,thinpack-rt/node-cluster

      - name: Pack and run hello.exe
        shell: bash
        run: |
          target/debug/thinpack pack examples/hello.js -o hello.exe --template target/debug/thinpack-rt.exe
          ./hello.exe > smoke.out
          cat smoke.out
          grep -q "answer: 42" smoke.out
          grep -q "microtask completed" smoke.out

      - name: Pack and run hello-fs.exe
        shell: bash
        run: |
          target/debug/thinpack pack examples/hello-fs.js -o hello-fs.exe --template target/debug/thinpack-rt.exe
          ./hello-fs.exe > fs.out
          cat fs.out
          grep -q "hello from fs" fs.out
          grep -q "isFile: true" fs.out
          grep -q "mtimeMs: 2000000" fs.out

      - name: Pack and run hello-os.exe
        shell: bash
        run: |
          target/debug/thinpack pack examples/hello-os.js -o hello-os.exe --template target/debug/thinpack-rt.exe
          ./hello-os.exe > os.out
          cat os.out
          grep -q "platform: win32" os.out
          grep -q "cpus: true" os.out
          grep -q "totalmem: true" os.out
          grep -q "interfaces: true" os.out

      - name: Pack and run hello-pipe.exe
        shell: bash
        run: |
          target/debug/thinpack pack examples/hello-pipe.js -o hello-pipe.exe --template target/debug/thinpack-rt.exe
          ./hello-pipe.exe > pipe.out || true
          cat pipe.out
          grep -q "pipe ok" pipe.out

      - name: Pack and run hello-cluster.exe
        shell: bash
        run: |
          target/debug/thinpack pack examples/hello-cluster.js -o hello-cluster.exe --template target/debug/thinpack-rt.exe
          ./hello-cluster.exe > cluster.out || true
          cat cluster.out
          grep -q "primary: worker online" cluster.out

  windows-tests:
    name: Runtime tests (windows-latest)
    # Two jobs rather than one: the capability-sliced template of `windows-smoke`
    # and the full runtime here are different feature sets of the same crates, so
    # in a single job the second build recompiles the workspace and the cache
    # carries only the last configuration, leaving every run warm for one of them
    # and cold for the other. Apart, each job's cache stays warm and the two
    # builds run at once, so a run costs the longer job instead of the sum.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `Swatinem/rust-cache` stores `~/.cargo/registry` but prunes the sparse
      # index entries of anything outside the dependency graph, so cargo
      # revalidates the index over the network on every run: `Updating crates.io
      # index` costs 2 s on a good runner and 131 s on a bad one, with nothing to
      # compile behind it. Keep the index in a cache of its own, and when both it
      # and the workspace cache match `Cargo.lock` exactly, keep cargo offline.
      - uses: actions/cache@v6
        id: index
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-index-${{ runner.os }}-
      - name: Cargo offline while the caches match
        shell: bash
        run: echo "CARGO_NET_OFFLINE=${{ steps.index.outputs.cache-hit == 'true' && steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      - name: Full runtime (all builtins)
        run: cargo build -p thinpack-rt

      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast
