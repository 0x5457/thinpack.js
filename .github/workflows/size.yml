name: Size

# Artifact size is the product's headline claim, so the programs the README compares are
# packed from pinned fixtures in `tests/apps/` and measured against
# `tests/apps/baseline.toml`. Each app is packed with `--rebuild`, which compiles a runtime
# for its own capability closure; the job therefore costs several template builds, and a
# pull request pays for it only when labelled `size`. Main, the weekly schedule and a
# dispatch keep the baseline honest.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "xtask/**"
      - "tests/apps/**"
      - "capabilities.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/size.yml"
  pull_request:
    # `labeled` so adding the `size` label starts the job without a push.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  apps:
    name: App artifacts (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'size')
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false

      # The `--rebuild` templates share `target/templates`; caching it keeps the C
      # dependencies (QuickJS/WAMR, sqlite) from compiling once per app on every
      # run.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/apps/*/package-lock.json

      # The command writes the table and every regression to the step summary before it
      # exits, so a failed run still shows what moved.
      - name: Pack and measure
        run: cargo xtask apps --summary "$GITHUB_STEP_SUMMARY"

      # Keep the minimal runtime measurement visible even if an app regresses.
      - name: Measure hello
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo build --release --locked -p thinpack-cli
          artifact="$RUNNER_TEMP/thinpack-hello"
          target/release/thinpack pack tests/apps/hello/main.js --rebuild --source "$PWD" -o "$artifact"
          test "$("$artifact")" = "hello"
          raw=$(wc -c < "$artifact")
          compressed=$(gzip -9 -n -c "$artifact" | wc -c)
          {
            echo "### Minimal packed executable"
            echo
            echo '| Program | Artifact (bytes) | gzip (bytes) |'
            echo '| --- | ---: | ---: |'
            printf '| `console.log("hello")` | %s | %s |\n' "$raw" "$compressed"
          } >> "$GITHUB_STEP_SUMMARY"
