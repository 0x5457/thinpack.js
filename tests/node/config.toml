# Node.js compatibility suite manifest.
#
# Each key is a file under `tests/node/compat/test`, copied from Node.js'
# `test/` directory. `module` groups the test for filtering and reporting;
# `ignore` records why a ported test does not run yet. An ignored test is still
# part of the suite: `cargo test ... -- --ignored` runs it, and the reason is
# printed by `--list`.
#
# The runner refuses to start when a `test-*` file under `parallel/` is missing
# here, so copying a test is never enough on its own.


