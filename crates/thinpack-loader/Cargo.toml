[package]
name = "thinpack-loader"
description = "CommonJS module semantics: require, cache, cycles, entry"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `module.register` hooks need a second isolate; apps without node:module skip it.
esm-hooks = ["dep:tokio"]

[dependencies]
thinpack-js.workspace = true
thinpack-cjs-lexer.workspace = true
deno_core.workspace = true
thinpack-core.workspace = true
thinpack-resolve.workspace = true
thinpack-caps.workspace = true
deno_error = "0.7"
thinpack-vfs.workspace = true
url = "2"
tokio = { workspace = true, optional = true }


[dev-dependencies]
thinpack-core = { workspace = true, features = ["backend-quickjs"] }

[lints]
workspace = true
