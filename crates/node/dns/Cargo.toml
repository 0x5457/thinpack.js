[package]
name = "thinpack-node-dns"
description = "DNS lookup (dns) for thinpack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thinpack-js.workspace = true
deno_core.workspace = true
deno_error.workspace = true
tokio.workspace = true
hickory-resolver = "0.26"

# The unix lookup path and the exported AI_* constants read the host headers.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[lints]
workspace = true
