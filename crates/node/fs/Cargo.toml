[package]
name = "thinpack-node-fs"
description = "File system for thinpack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thinpack-js.workspace = true
thinpack-node-internals = { workspace = true, features = ["glob"] }
deno_core.workspace = true
deno_error.workspace = true
thinpack-core = { workspace = true }
getrandom = "0.4"
libc = "0.2"
notify = "9.0"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
