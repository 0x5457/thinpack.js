[package]
name = "thinpack-rt"
description = "thinpack runtime template: engine, core, and the selected builtin modules"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "thinpack-rt"
path = "src/main.rs"

# The Node.js compatibility suite. `harness = false` because the cases are
# discovered from tests/node/config.toml rather than compiled into the crate.
[[test]]
name = "node"
path = "tests/node.rs"
harness = false

[dependencies]
thinpack-js.workspace = true
deno_core.workspace = true
thinpack-core.workspace = true
thinpack-caps.workspace = true
thinpack-loader.workspace = true
thinpack-resolve.workspace = true
thinpack-pack.workspace = true
thinpack-vfs.workspace = true
thinpack-io.workspace = true
thinpack-node-internals.workspace = true
thinpack-child = { workspace = true, optional = true }
thinpack-node-console = { workspace = true, optional = true }
thinpack-node-constants = { workspace = true, optional = true }
thinpack-node-process = { workspace = true, optional = true }
thinpack-node-timers = { workspace = true, optional = true }
thinpack-node-path = { workspace = true, optional = true }
thinpack-node-events = { workspace = true, optional = true }
thinpack-node-fs = { workspace = true, optional = true }
thinpack-node-stream = { workspace = true, optional = true }
thinpack-node-net = { workspace = true, optional = true }
thinpack-node-dns = { workspace = true, optional = true }
thinpack-node-domain = { workspace = true, optional = true }
thinpack-node-tls = { workspace = true, optional = true }
thinpack-node-http = { workspace = true, optional = true }
thinpack-node-fetch = { workspace = true, optional = true }
thinpack-node-https = { workspace = true, optional = true }
thinpack-node-http2 = { workspace = true, optional = true }
thinpack-node-inspector = { workspace = true, optional = true }
thinpack-node-readline = { workspace = true, optional = true }
thinpack-node-assert = { workspace = true, optional = true }
thinpack-node-diagnostics-channel = { workspace = true, optional = true }
thinpack-node-async-hooks = { workspace = true, optional = true }
thinpack-node-zlib = { workspace = true, optional = true }
thinpack-node-perf-hooks = { workspace = true, optional = true }
thinpack-node-worker-threads = { workspace = true, optional = true }
thinpack-node-child-process = { workspace = true, optional = true }
thinpack-node-cluster = { workspace = true, optional = true }
thinpack-node-vm = { workspace = true, optional = true }
thinpack-node-os = { workspace = true, optional = true }
thinpack-node-module = { workspace = true, optional = true }
thinpack-node-v8 = { workspace = true, optional = true }
thinpack-node-tty = { workspace = true, optional = true }
thinpack-node-crypto = { workspace = true, optional = true }
thinpack-node-string-decoder = { workspace = true, optional = true }
thinpack-node-querystring = { workspace = true, optional = true }
thinpack-node-punycode = { workspace = true, optional = true }
thinpack-node-buffer = { workspace = true, optional = true }
thinpack-node-util = { workspace = true, optional = true }
thinpack-node-url = { workspace = true, optional = true }
thinpack-node-sea = { workspace = true, optional = true }
thinpack-node-test = { workspace = true, optional = true }
thinpack-node-sqlite = { workspace = true, optional = true }
thinpack-node-ffi = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1.2"

# BEGIN GENERATED FEATURES
