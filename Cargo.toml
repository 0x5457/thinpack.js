[workspace]
resolver = "3"
exclude = ["vendor/deno_core", "vendor/deno_ffi"]
members = [
    "crates/thinpack-core",
    "crates/thinpack-caps",
    "crates/thinpack-js",
    "crates/thinpack-resolve",
    "crates/thinpack-loader",
    "crates/thinpack-io",
    "crates/thinpack-analyze",
    "crates/thinpack-pack",
    "crates/thinpack-vfs",
    "crates/thinpack-cli",
    "crates/thinpack-node-internals",
    "crates/thinpack-rt",
    "crates/node/console",
    "crates/node/constants",
    "crates/node/process",
    "crates/node/timers",
    "crates/node/path",
    "crates/node/events",
    "crates/node/fs",
    "crates/node/https",
    "crates/node/querystring",
    "crates/node/buffer",
    "crates/node/util",
    "crates/node/url",
    "crates/node/sea",
    "crates/node/ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Strictest lint baseline. `cargo clippy --workspace --all-targets` must stay silent;
# `cargo xtask lint` additionally checks the V8 backend and rustfmt.
# Every allowance needs a reason: either the lint is wrong or the constraint comes from outside
# this workspace.
[workspace.lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_lifetimes = "deny"
unsafe_op_in_unsafe_fn = "deny"
# An allowance must not rot: an `#[expect]` that does not fire is an error.
unfulfilled_lint_expectations = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# The restriction group is not enabled wholesale: only the one lint that matches our constraints.
undocumented_unsafe_blocks = "deny"

# Internal crates are not published, so repository/keywords/categories mean nothing.
cargo_common_metadata = "allow"
# Duplicate versions in the dependency tree are decided upstream.
multiple_crate_versions = "allow"
# The runtime is a single-threaded !Send environment (deno_core's JsRuntime is not Send).
future_not_send = "allow"
# The guard's scope is deliberate; tightening it would only create nesting.
significant_drop_tightening = "allow"
# Directly contradicts rustc's `unreachable_pub`: inside private modules it considers
# `pub(crate)` redundant and demands `pub`, which is exactly what unreachable_pub forbids.
# Visibility follows actual reachability (`pub(crate)`), so this nursery lint stays off.
redundant_pub_crate = "allow"

[workspace.dependencies]
deno_error = "0.7.1"
thinpack-core = { path = "crates/thinpack-core", default-features = false }
thinpack-caps = { path = "crates/thinpack-caps" }
thinpack-js = { path = "crates/thinpack-js" }
thinpack-resolve = { path = "crates/thinpack-resolve" }
thinpack-loader = { path = "crates/thinpack-loader" }
thinpack-io = { path = "crates/thinpack-io" }
thinpack-node-internals = { path = "crates/thinpack-node-internals" }
thinpack-pack = { path = "crates/thinpack-pack" }
thinpack-analyze = { path = "crates/thinpack-analyze" }
thinpack-vfs = { path = "crates/thinpack-vfs" }
thinpack-node-console = { path = "crates/node/console" }
thinpack-node-constants = { path = "crates/node/constants" }
thinpack-node-process = { path = "crates/node/process" }
thinpack-node-timers = { path = "crates/node/timers" }
thinpack-node-path = { path = "crates/node/path" }
thinpack-node-events = { path = "crates/node/events" }
thinpack-node-fs = { path = "crates/node/fs" }
thinpack-node-stream = { path = "crates/node/stream" }
thinpack-node-net = { path = "crates/node/net" }
thinpack-node-dns = { path = "crates/node/dns" }
thinpack-node-tls = { path = "crates/node/tls" }
thinpack-node-http = { path = "crates/node/http" }
thinpack-node-https = { path = "crates/node/https" }
thinpack-node-http2 = { path = "crates/node/http2" }
thinpack-node-inspector = { path = "crates/node/inspector" }
thinpack-node-readline = { path = "crates/node/readline" }
thinpack-node-assert = { path = "crates/node/assert" }
thinpack-node-diagnostics-channel = { path = "crates/node/diagnostics-channel" }
thinpack-node-async-hooks = { path = "crates/node/async-hooks" }
thinpack-node-zlib = { path = "crates/node/zlib" }
thinpack-node-perf-hooks = { path = "crates/node/perf-hooks" }
thinpack-node-worker-threads = { path = "crates/node/worker-threads" }
thinpack-node-child-process = { path = "crates/node/child-process" }
thinpack-node-cluster = { path = "crates/node/cluster" }
thinpack-node-vm = { path = "crates/node/vm" }
thinpack-node-os = { path = "crates/node/os" }
thinpack-node-module = { path = "crates/node/module" }
thinpack-node-v8 = { path = "crates/node/v8" }
thinpack-node-tty = { path = "crates/node/tty" }
thinpack-node-crypto = { path = "crates/node/crypto" }
thinpack-node-string-decoder = { path = "crates/node/string-decoder" }
thinpack-node-querystring = { path = "crates/node/querystring" }
thinpack-node-buffer = { path = "crates/node/buffer" }
thinpack-node-util = { path = "crates/node/util" }
thinpack-node-url = { path = "crates/node/url" }
thinpack-node-sea = { path = "crates/node/sea" }
thinpack-node-ffi = { path = "crates/node/ffi" }
thinpack-node-sqlite = { path = "crates/node/sqlite" }

deno_core = { path = "vendor/deno_core", default-features = false, features = ["reactor-tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
