# vendored `deno_v8 0.5.0` with one change: a `jsc` feature that selects the v8x
# system-JavaScriptCore backend. See PATCHES.md.

[package]
edition = "2024"
name = "deno_v8"
version = "0.5.0"
authors = ["the Deno authors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "JavaScript engine facade for Deno"
readme = false
license = "MIT"
repository = "https://github.com/denoland/deno"
resolver = "2"

[features]
default = ["v8"]
# thinpack patch: the macOS system JavaScriptCore framework, via v8x. The
# vendored-JSC variant (`v8x/jsc`) is not shipped in the v8x crate, so this
# maps to the framework path.
jsc = [
    "dep:v8x_backend",
    "v8x_backend/system_jsc",
]
quickjs = [
    "dep:v8x_backend",
    "v8x_backend/quickjs",
]
simdutf = [
    "rusty_v8?/simdutf",
    "v8x_backend?/simdutf",
]
use_custom_libcxx = [
    "rusty_v8?/use_custom_libcxx",
    "v8x_backend?/use_custom_libcxx",
]
v8 = ["dep:rusty_v8"]
v8_enable_pointer_compression = [
    "rusty_v8?/v8_enable_pointer_compression",
    "v8x_backend?/v8_enable_pointer_compression",
]
v8_enable_sandbox = [
    "rusty_v8?/v8_enable_sandbox",
    "v8x_backend?/v8_enable_sandbox",
]
v8_enable_v8_checks = [
    "rusty_v8?/v8_enable_v8_checks",
    "v8x_backend?/v8_enable_v8_checks",
]

[lib]
name = "deno_v8"
path = "lib.rs"

[dependencies.rusty_v8]
version = "150.4.0"
optional = true
default-features = false
package = "v8"

[dependencies.v8x_backend]
version = "=149.4.0-rc.4"
optional = true
default-features = false
package = "v8x"
